seed: 42
model:
  kind: residual_xgboost_experimental
  version: byron2017-xgb-v1
  n_estimators: 150
  learning_rate: 0.05
  max_depth: 5
  tree_method: hist
  num_leaves: 31 # residual-scale LightGBM
features:
  horizon_hours: 1
  lags: [1, 24, 168]
  rolling_windows: [24, 168]
  weather: [air_temperature]
  holidays: []
conformal:
  alpha: 0.095
  scale_fraction: 0.65
  min_scale: 0.001
  rejection_fraction: 0.15
  max_relative_width: 1.0
  risk_weights: [0.70, 0.15, 0.10, 0.05]
data:
  frequency: 1h
  timezone: UTC # raw wall-clock relabel for feature adapter only
  units: kWh
  columns:
    timestamp: timestamp
    building_id: building_id
    target: meter_reading
    usage: primary_use
    air_temperature: air_temperature
